# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name www.tk-docker.fun tk-docker.fun 47.83.164.62;

    # 证书申请时临时注释下面两行，申请完成后再取消注释
    return 301 https://$host$request_uri;
}

# HTTPS 站点
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tk-docker.fun tk-docker.fun 47.83.164.62;

    # SSL 证书（certbot 申请后自动填入）
    ssl_certificate     /etc/letsencrypt/live/www.tk-docker.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.tk-docker.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/project/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8234;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
